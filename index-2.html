<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0614">
<meta name="description" content="Spotylive — موسیقی‌ات را آپلود کن، با دوستانت چت کن و هم‌زمان گوش بده.">
<title>Spotylive</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spotylive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- پس‌زمینهٔ نوری متحرک -->
  <div id="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div id="grain" aria-hidden="true"></div>

  <!-- اسپلش -->
  <div id="splash">
    <div class="splash-logo">
      <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
      <img src="logo.svg" alt="Spotylive">
    </div>
    <h1 class="brand">Spotylive</h1>
    <p>با هم گوش بده، همین حالا</p>
  </div>

  <!-- ورود / ثبت‌نام -->
  <section id="auth" hidden></section>

  <!-- اپ اصلی -->
  <div id="app" hidden>
    <aside id="side" class="glass">
      <div class="side-brand"><img src="logo.svg" alt=""><b class="brand">Spotylive</b></div>
      <nav class="side-nav" id="sideNav"></nav>
      <button class="btn primary w100" data-act="upload"></button>
    </aside>
    <main id="view"></main>
    <div id="mini" class="glass liquid" hidden></div>
    <nav id="tabbar" class="glass liquid"><span class="blob"></span></nav>
  </div>

  <!-- صفحهٔ پخش کامل -->
  <section id="np" aria-hidden="true"></section>

  <div id="sheets"></div>
  <div id="toasts"></div>

  <input type="file" id="fileAudio" accept="audio/*,.mp3,.m4a,.flac,.wav,.ogg,.aac" multiple hidden>
  <input type="file" id="fileImg" accept="image/*" hidden>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
