<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="blob" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#8ff6ff"/>
      <stop offset=".55" stop-color="#2f8bff"/>
      <stop offset=".8" stop-color="#2a3cff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2a3cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#9aa6c8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6f2ff"/>
    </linearGradient>
    <mask id="ring">
      <rect x="96" y="96" width="320" height="320" rx="80" fill="#fff"/>
      <rect x="122" y="122" width="268" height="268" rx="60" fill="#000"/>
    </mask>
    <clipPath id="inner"><rect x="96" y="96" width="320" height="320" rx="80"/></clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="nglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="lights">
      <ellipse cx="392" cy="122" rx="120" ry="70" fill="url(#blob)" transform="rotate(30 392 122)"/>
      <ellipse cx="120" cy="392" rx="120" ry="70" fill="url(#blob)" transform="rotate(30 120 392)"/>
    </g>
  </defs>

  <!-- body -->
  <rect x="96" y="96" width="320" height="320" rx="80" fill="#03040a"/>

  <!-- soft light spilling inside -->
  <g clip-path="url(#inner)" opacity=".45" filter="url(#blur)">
    <use href="#lights">
      <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="7s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- light orbiting the glass edge -->
  <g mask="url(#ring)">
    <use href="#lights">
      <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="7s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- glass rims -->
  <rect x="96" y="96" width="320" height="320" rx="80" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <rect x="86" y="86" width="340" height="340" rx="88" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>

  <!-- beamed note -->
  <g filter="url(#nglow)" fill="url(#note)" transform="translate(256 256) scale(.86) translate(-262 -252)">
    <path d="M214 196 L338 166 Q348 164 348 174 L348 300 L324 300 L324 206 L238 227 L238 330 L214 330 Z"/>
    <ellipse cx="200" cy="330" rx="40" ry="31" transform="rotate(-22 200 330)"/>
    <ellipse cx="310" cy="300" rx="40" ry="31" transform="rotate(-22 310 300)"/>
    <animate attributeName="opacity" values="1;.86;1" dur="3.5s" repeatCount="indefinite"/>
  </g>
</svg>
